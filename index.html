<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Tap Cepat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Game Tap Cepat</h1>
    <p>Tekan tombol mulai, lalu tap kotak secepat mungkin selama 10 detik!</p>

    <div class="info">
      <p>Waktu: <span id="time">10</span> detik</p>
      <p>Skor: <span id="score">0</span></p>
    </div>

    <button id="startBtn">Mulai Game</button>

    <div id="gameArea" class="game-area">
      TAP DI SINI
    </div>

    <p id="message"></p>
  </div>

  <script src="script.js"></script>
</body>
  </html>
